default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch('RAILS_MAX_THREADS', 5) %>

development:
  <<: *default
  url: <%= ENV['DATABASE_URL'] %>

test:
  <<: *default
  url: <%= ENV.fetch('DATABASE_URL', 'postgres://permitdesk:permitdesk@localhost:5432/permitdesk_development').sub(/_development\z/, '_test') %>
